name: Bump SW cache version

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump service worker cache version
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Replace BUILD_TIMESTAMP in both files
          sed -i "s/BUILD_TIMESTAMP/${TIMESTAMP}/g" sw.js
          sed -i "s/BUILD_TIMESTAMP/${TIMESTAMP}/g" index.html

          echo "Bumped to ${TIMESTAMP}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add sw.js index.html && git commit -m "chore: bump SW cache [skip ci]")
          git push
